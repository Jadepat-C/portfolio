server {
    # IPv4 only, so the container also starts on hosts with IPv6 turned off.
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the Nginx version.
    server_tokens off;

    # Compress text files before sending them.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Basic security headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Vite puts a content hash in every file name under /assets/,
    # so browsers can cache them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Every other path: serve the file if it exists, otherwise hand the
    # request to index.html so React Router can show the right page.
    # This is what makes refreshing /profile work.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Always re-check index.html, so a new deploy shows up right away.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
